name = "termpolis-relay"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "PAIRING_ROOM"
class_name = "PairingRoom"

# SQLite-backed, not the KV-backed `new_classes`. Two reasons, and only one of
# them is about money: SQLite-backed Durable Objects are the only kind the
# Workers free plan will create, and they are what Cloudflare provisions for new
# classes by default. PairingRoom keeps nothing across a request anyway -- its
# only storage calls are setAlarm/deleteAlarm for the idle timeout, which both
# backends support identically.
#
# This can only be chosen once. A class deployed under `new_classes` cannot be
# moved to SQLite afterwards, so getting it right before the first deploy is the
# whole point of the comment.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingRoom"]

# Registration rate limit. A per-room quota cannot stop someone creating a million
# rooms, so room creation itself is limited at the edge, keyed by source address.
# 30 per minute is far above any real pairing rate and far below what it takes to
# make room creation a useful amplifier.
[[unsafe.bindings]]
name = "REGISTRATIONS"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
