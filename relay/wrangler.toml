name = "termpolis-relay"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# No workers.dev hostname. The relay is reachable at exactly one name, the one
# both clients ship as their default; a second, unauthenticated public hostname
# for a pairing relay is attack surface with no user behind it. Turning it off
# also drops wrangler's demand that the account have a workers.dev subdomain
# provisioned at all (API error 10063 on a first deploy).
workers_dev = false

# The hostname both sides ship as their default -- `DEFAULT_RELAY_URL` in
# `relay/src` has no say in it; `mobile/src/wire/protocol.ts` and
# `src/main/remoteSettings.ts` both hardcode `wss://relay.termpolis.com`, so a
# Worker reachable only at its `workers.dev` name is a Worker no client can find.
#
# Declared here rather than clicked in the dashboard so that a deploy from CI
# provisions it too. `custom_domain` (not a route): a route would need the zone
# to already answer for the hostname, while a custom domain creates the DNS
# record and the certificate as part of the deploy. termpolis.com is already on
# Cloudflare nameservers, which is what makes this legal.
[[routes]]
pattern = "relay.termpolis.com"
custom_domain = true

[[durable_objects.bindings]]
name = "PAIRING_ROOM"
class_name = "PairingRoom"

# SQLite-backed, not the KV-backed `new_classes`. Two reasons, and only one of
# them is about money: SQLite-backed Durable Objects are the only kind the
# Workers free plan will create, and they are what Cloudflare provisions for new
# classes by default. PairingRoom keeps nothing across a request anyway -- its
# only storage calls are setAlarm/deleteAlarm for the idle timeout, which both
# backends support identically.
#
# This can only be chosen once. A class deployed under `new_classes` cannot be
# moved to SQLite afterwards, so getting it right before the first deploy is the
# whole point of the comment.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingRoom"]

# Registration rate limit. A per-room quota cannot stop someone creating a million
# rooms, so room creation itself is limited at the edge, keyed by source address.
# 30 per minute is far above any real pairing rate and far below what it takes to
# make room creation a useful amplifier.
[[unsafe.bindings]]
name = "REGISTRATIONS"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
