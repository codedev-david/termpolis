<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>World harness</title>
  <style>
    html, body { margin: 0; height: 100%; background: #03050a; overflow: hidden; }
    #view { position: absolute; inset: 0; }
    #card { position: absolute; top: 12px; right: 12px; width: 300px; max-height: 60%; overflow: auto;
      background: #0f172a; color: #e2e8f0; font: 13px system-ui, sans-serif; padding: 10px; border-radius: 8px; }
    #card[hidden] { display: none; }
  </style>
</head>
<body>
  <script>
    // Runs before the module: anything thrown or rejected while the bundle loads lands here too.
    window.__errors = []
    window.addEventListener('error', (e) => { window.__errors.push('error: ' + (e.message || String(e.error))) })
    window.addEventListener('unhandledrejection', (e) => { window.__errors.push('unhandledrejection: ' + String(e.reason)) })
  </script>
  <div id="view"></div>
  <aside id="card" hidden></aside>
  <script type="module">
    // Test harness only. It imports the built bundle, as the website will, and loads the Task 1
    // fixture world. window.__worldTest is the spec's handle; it is not part of the viewer API.
    import { createWorldViewer, validateWorld } from '../../../dist-world/world-viewer.js'

    const card = document.getElementById('card')
    const view = document.getElementById('view')
    // Reduced motion (instant camera jumps, no change animations) unless the page is opened with
    // ?motion=1, which the "watch it grow" spec uses to see the rise play.
    const motion = new URLSearchParams(location.search).get('motion') === '1'
    const viewer = createWorldViewer(view, {
      reducedMotion: !motion,
      renderCard: (html) => {
        card.innerHTML = html === null ? '' : html
        card.hidden = html === null
      },
    })
    const raw = await (await fetch(new URL('../../shared/fixtures/world.min.json', import.meta.url))).json()
    const checked = validateWorld(raw)
    if (!checked.ok) throw new Error('fixture world is invalid: ' + checked.errors.join('; '))
    viewer.load(checked.doc)

    window.__worldTest = {
      /**
       * Screen point of a building: frames it with a focus action (reducedMotion makes the flight
       * an instant jump, so the building sits at the centre of the view) and returns that centre.
       */
      async project(id) {
        await viewer.apply({ type: 'focus', ids: [id] })
        const r = view.querySelector('canvas').getBoundingClientRect()
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 }
      },
      selection: () => viewer.getSelection(),
      /** Validates a world and loads it, as WorldView does (opts.animateFrom: the world it grows from). */
      load(doc, opts) {
        const next = validateWorld(doc)
        if (!next.ok) throw new Error('world is invalid: ' + next.errors.join('; '))
        viewer.load(next.doc, opts)
      },
      drawn: () => viewer.drawn(),
      /** Asks for a frame (a view at rest draws none of its own: reduced motion moves nothing). */
      requestFrame: () => viewer.requestFrame(),
      screenPoint: (id) => viewer.screenPoint(id),
    }
    document.body.dataset.ready = '1'
  </script>
</body>
</html>
