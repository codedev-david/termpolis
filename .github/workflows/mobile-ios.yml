name: Publish iOS

# Termpolis Remote is the one part of this product that cannot ship through
# `release.yml`. It is not an Electron artifact; it is an Expo app that has to be
# compiled by Apple's toolchain, signed with an Apple distribution certificate,
# and handed to App Store Connect. This workflow does all three without a Mac,
# without an interactive Apple login, and without a human watching it.
#
# WHAT MAKES IT NON-INTERACTIVE
#
# Two credentials, and the reason for each is worth stating because getting one
# of them slightly wrong produces an error that reads like something else:
#
#   EXPO_TOKEN                 authenticates eas-cli to the Expo account.
#   EXPO_ASC_API_KEY_PATH  \   an App Store Connect API key. eas-cli uses it for
#   EXPO_ASC_KEY_ID         >  BOTH halves of the job: minting the distribution
#   EXPO_ASC_ISSUER_ID     /   certificate and provisioning profile, and the
#                              upload itself.
#
# That the API key covers credential creation is not folklore -- it is what
# eas-cli says when it refuses:
#
#   credentials/ios/actions/CreateProvisioningProfile.js:27
#   "In order to generate a new Provisioning Profile, authentication with an ASC
#    API key is required in non-interactive mode. Either set the
#    EXPO_ASC_API_KEY_PATH/EXPO_ASC_KEY_ID/EXPO_ASC_ISSUER_ID environment
#    variables, or configure an App Store Connect API Key for submissions..."
#
# So no Apple ID, no password, no 2FA code, and no `FASTLANE_SESSION` cookie that
# silently expires a month after someone pastes it.
#
# THE KEY MUST HAVE THE **ADMIN** ROLE. App Manager is the role that looks
# correct and is not: it can upload builds but cannot create certificates, so the
# submit step would work and the build step would fail -- in a run where the
# error appears long after the step that caused it.
#
# WHY THE SUBMIT PROFILE IS PATCHED AT RUN TIME
#
# `eas submit --non-interactive` requires `ascAppId` in the submit profile:
#
#   submit/ios/IosSubmitCommand.js:143
#   "Set ascAppId in the submit profile (eas.json) or re-run this command in
#    interactive mode."
#
# The obvious fix -- `"ascAppId": "$ASC_APP_ID"` in eas.json -- does not work.
# eas.json interpolates environment variables into exactly three iOS submit
# fields (`@expo/eas-json`, `submit/types.js`: `ascApiKeyPath`,
# `ascApiKeyIssuerId`, `ascApiKeyId`) and `ascAppId` is not one of them; the
# literal string `$ASC_APP_ID` would reach Apple and fail a digits-only check.
# So the value is written into the checkout after the build and reverted after
# the submit. It never reaches a commit.
#
# The committed eas.json keeps its documented placeholders, and
# `mobile/__tests__/appConfig.test.ts` keeps asserting that the file carries the
# two public identifiers and no credential.

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Build message shown in the EAS dashboard'
        type: string
        default: ''
      submit:
        description: 'Upload the finished build to App Store Connect'
        type: boolean
        default: true
      submit_only:
        description: 'Skip the build and upload the last one EAS built'
        type: boolean
        default: false
      dry_run:
        description: 'Run the gates and resolve credentials, then stop'
        type: boolean
        default: false

# An iOS build takes tens of minutes on EAS's queue and increments a build number
# that Apple will never accept twice. Two of them racing is how you get a wasted
# build number and a confusing submission history, so: one at a time, and never
# cancel one that is already running.
concurrency:
  group: mobile-ios
  cancel-in-progress: false

# Write, because linking the EAS project rewrites app.json and that identity has
# to survive the runner. Nothing else here commits.
permissions:
  contents: write

env:
  EAS_CLI_VERSION: 23.2.0
  # Bundle identifier is not re-assignable after the first upload; it is asserted
  # in mobile/__tests__/appConfig.test.ts and repeated here only for the log.
  BUNDLE_ID: com.termpolis.remote

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      # The same gates test.yml runs, repeated here on purpose. This workflow can
      # be dispatched against any commit, including one Tests never saw, and
      # "someone probably ran the suite" is not a gate. An iOS build that fails
      # review costs days; a test run costs three minutes.
      - name: Typecheck mobile
        run: npm --prefix mobile run typecheck

      # src/wire/ is a second implementation of the same wire format and compiles
      # under its own tsconfig; the outer typecheck does not reach it.
      - name: Typecheck the wire types
        run: npm --prefix mobile run typecheck:wire

      # With --coverage, matching test.yml. The mobile floors are 100 on all four
      # counters and they live in the coverage run -- without the flag this step
      # passes on a suite that skipped whole files.
      - name: Test mobile
        run: npm --prefix mobile run test:coverage

      # Distinguishes "no credential" from "bad credential" before eas-cli
      # produces its own, less helpful version of the same message. Each missing
      # value is named, with where it comes from, because the four of them are
      # minted in three different places.
      - name: Check for credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          missing=""
          [ -n "$EXPO_TOKEN" ]   || missing="$missing EXPO_TOKEN"
          [ -n "$ASC_KEY_ID" ]   || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]   || missing="$missing ASC_KEY_P8"
          if [ -z "$missing" ]; then
            echo "All four credentials are present."
            exit 0
          fi
          # A dry run reaches Expo and stops before Apple: it resolves the
          # account, mints the EAS project and commits the link back to main.
          # None of that touches the App Store Connect key. Letting it run on
          # EXPO_TOKEN alone is the point -- it proves the Expo half while the
          # Apple half is still being collected, instead of leaving both halves
          # to fail for the first time on the same run.
          if [ "$DRY_RUN" = "true" ] && [ -n "$EXPO_TOKEN" ]; then
            fatal=""
            echo "Dry run. EXPO_TOKEN is present, which is all this run needs."
            echo "Still to collect before a real build:$missing"
          else
            fatal=1
            echo "Cannot build iOS. Missing:$missing"
          fi
          echo
          echo "EXPO_TOKEN"
          echo "  expo.dev -> account settings -> Access tokens -> Create token."
          echo "  gh secret set EXPO_TOKEN"
          echo
          echo "ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8"
          echo "  appstoreconnect.apple.com -> Users and Access -> Integrations"
          echo "  -> App Store Connect API -> Team Keys -> +"
          echo "  Role must be ADMIN. App Manager cannot create signing"
          echo "  certificates, and the run would fail at the build, not here."
          echo "  The .p8 downloads exactly once and cannot be re-downloaded."
          echo
          echo "  Issuer ID is on that page. Key ID is the row's own column."
          echo "  gh secret set ASC_KEY_ID    --body '<key id>'"
          echo "  gh secret set ASC_ISSUER_ID --body '<issuer id>'"
          echo "  gh secret set ASC_KEY_P8 < AuthKey_XXXXXXXXXX.p8"
          [ -z "$fatal" ] || exit 1

      - name: Install eas-cli
        run: npm install -g "eas-cli@${EAS_CLI_VERSION}"

      # Written outside the checkout so it cannot be committed by any later step,
      # and mode 600 so it is not readable by another process on the runner. The
      # cleanup step below runs even when the build fails.
      #
      # `gh secret set ASC_KEY_P8 < AuthKey.p8` stores the PEM verbatim, so the
      # secret is used as-is. A base64 blob is accepted too, because pasting one
      # into the web UI is the other way people set this, and a key that arrives
      # in the wrong encoding otherwise fails inside fastlane with a message
      # about neither keys nor encodings.
      - name: Stage the App Store Connect key
        id: asckey
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          umask 077
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]' | base64 -d > "$key_path"
          fi
          chmod 600 "$key_path"
          if ! grep -q 'BEGIN PRIVATE KEY' "$key_path"; then
            echo "ASC_KEY_P8 is neither a PEM private key nor base64 of one."
            echo "Re-set it with: gh secret set ASC_KEY_P8 < AuthKey_XXXXXXXXXX.p8"
            exit 1
          fi
          echo "path=$key_path" >> "$GITHUB_OUTPUT"
          echo "Staged an App Store Connect key ($(wc -c < "$key_path") bytes)."

      # eas-cli needs to be told which account owns the project, and the answer
      # is not in the token, the repository, or app.json. It has to be asked for.
      #
      # A repository variable overrides it, for the case of a token that can act
      # for more than one account. Anything else -- a variable they can only get
      # wrong -- is a step worth removing.
      - name: Resolve the Expo account
        id: account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OVERRIDE: ${{ vars.EXPO_ACCOUNT }}
        run: |
          set -eo pipefail
          if [ -n "$OVERRIDE" ]; then
            account="$OVERRIDE"
          else
            # `eas whoami` does not print a bare username. A token minted at
            # expo.dev authenticates as a ROBOT, and a robot owns no account of
            # its own -- it acts for the accounts it was granted, listed under a
            # heading:
            #
            #   termpolis-github (robot) (authenticated using EXPO_TOKEN)
            #   Accounts:
            #   * davidcodedev-llc (Role: Admin)
            #
            # So the account is the bullet, never the first line. Flattening the
            # whole block into one string produces a name EAS rejects with "You
            # are not able to create projects in the ... account", which reads
            # like a permissions problem and is really a parsing one. The bullet
            # glyph is multibyte, so match the first name-shaped run of
            # characters after the heading rather than stripping a literal
            # bullet.
            raw=$(eas whoami 2>/dev/null || true)
            names=$(echo "$raw" | awk '
              /^Accounts:/ { inlist = 1; next }
              inlist && match($0, /[A-Za-z0-9][A-Za-z0-9._-]*/) {
                print substr($0, RSTART, RLENGTH)
              }')
            account=$(echo "$names" | head -1)
            # A personal (non-robot) token prints just the username on line one.
            if [ -z "$account" ]; then
              account=$(echo "$raw" | head -1 | awk '{print $1}')
            fi
            # More than one means the line above picked for you. Say so, and name
            # the variable that settles it.
            count=$(echo "$names" | grep -c . || true)
            if [ "$count" -gt 1 ]; then
              echo "::warning::EXPO_TOKEN can act for $count accounts; using '$account'."
              echo "::warning::Set the EXPO_ACCOUNT repository variable to pick another."
            fi
          fi
          if [ -z "$account" ]; then
            echo "EXPO_TOKEN did not resolve to an account. It may be revoked or"
            echo "truncated. Mint a new one at expo.dev -> Access tokens."
            exit 1
          fi
          echo "account=$account" >> "$GITHUB_OUTPUT"
          echo "Building as @$account"
      - name: Link the EAS project
        id: link
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ACCOUNT: ${{ steps.account.outputs.account }}
        run: |
          set -eo pipefail
          cd mobile
          existing=$(node -p "require('./app.json').expo.extra?.eas?.projectId || ''")
          if [ -n "$existing" ]; then
            echo "Already linked to project $existing"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          eas init --account "$ACCOUNT" --non-interactive
          created=$(node -p "require('./app.json').expo.extra?.eas?.projectId || ''")
          if [ -z "$created" ]; then
            echo "eas init reported success but wrote no projectId into app.json."
            exit 1
          fi
          echo "Linked to project $created"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Commit the project link
        if: steps.link.outputs.committed == 'true'
        run: |
          set -eo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add mobile/app.json
          git commit \
            -m 'chore(mobile): link the EAS project' \
            -m 'Written by `eas init` on the first iOS build. The project id is a permanent identity for this app on EAS; regenerating it would split the build history in two.'
          git push origin HEAD:main

      - name: Stop here
        if: inputs.dry_run
        run: |
          {
            echo '### Dry run'
            echo
            echo 'Gates passed, credentials resolved, project linked. No build was'
            echo 'started. Re-run with **dry_run** unchecked to build.'
          } >> "$GITHUB_STEP_SUMMARY"

      # `eas build --non-interactive` can only ever REUSE a distribution
      # certificate -- SetUpDistributionCertificate.js:41-48 throws
      # MissingCredentialsNonInteractiveError when there is none -- so on an
      # Apple account that has never signed anything the first build dies four
      # seconds in with "Credentials are not set up", after authenticating to
      # Apple perfectly. Nothing about that failure is a credentials problem,
      # and re-checking the secrets is a dead end.
      #
      # `credentials:configure-build` is the same credential setup with
      # nonInteractive hardcoded to false (commands/credentials/configure-build.js)
      # and no build attached, so it costs seconds. It asks two questions --
      # "Generate a new Apple Distribution Certificate?" and the same for the
      # provisioning profile -- and both default to yes.
      #
      # Once it has run, the certificate and profile live on EAS and every later
      # --non-interactive build reuses them; this step then finds them valid,
      # prints "All credentials are ready to build" and exits without asking
      # anything. That is why it stays unconditional instead of hiding behind a
      # flag: a flag nobody remembers to tick is how this failure comes back
      # when the certificate expires in 2027.
      - name: Create the signing certificate
        if: ${{ !inputs.dry_run }}
        # A backstop, not the mechanism -- the driver has its own deadline. This
        # exists because the previous two attempts at this step failed by
        # running forever rather than by failing, and a wedged step otherwise
        # burns the job's full six-hour default.
        timeout-minutes: 12
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ${{ steps.asckey.outputs.path }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Mandatory, and NOT because the value is interesting. Unset,
          # resolveCredentials.js:131-141 asks "Select your Apple Team Type:" --
          # a select, not a confirm -- whose first entry is Enterprise. Pressing
          # Enter picks Enterprise, and that is the one answer on this path that
          # changes behaviour: it is the sole input to `inHouse` (:150), which
          # switches every provisioning profile lookup and creation to
          # IOS_APP_INHOUSE. COMPANY_OR_ORGANIZATION is correct however the
          # Apple account is enrolled, because `inHouse` is false for INDIVIDUAL
          # too, and it is also what eas-cli itself defaults to elsewhere
          # (ensureTestFlightSetup.js:32).
          EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
        run: |
          cd mobile
          set +e
          PTY_ANSWER_TIMEOUT=600 \
            python3 "$GITHUB_WORKSPACE/.github/scripts/pty-answer.py" \
            eas credentials:configure-build -p ios -e production
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "::error::iOS credential setup stopped on a question it could not answer."
            echo "The driver logs every prompt it sees, so the last '? ...' line above"
            echo "is the one it got stuck on. Answer that question with an environment"
            echo "variable rather than a keystroke -- EXPO_APPLE_TEAM_TYPE above is the"
            echo "worked example -- and do not add a blind answer for it."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Could not set up iOS signing credentials (exit $status)."
            echo "If Apple rejected the request rather than the CLI stalling, the"
            echo "likeliest cause is the App Store Connect key's role: creating"
            echo "certificates needs Admin, and an App Manager key authenticates"
            echo "fine and then cannot create them. Check the key in App Store"
            echo "Connect > Users and Access > Integrations. A key's role cannot be"
            echo "changed after it is issued -- revoke it, mint a new Admin key,"
            echo "and re-set ASC_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID."
            exit "$status"
          fi

      # --wait, because a workflow that returns before the build finishes reports
      # "success" for a build that has not compiled yet, and the submit step below
      # would have nothing to upload.
      #
      # The tree is clean at this point on purpose: eas.json is patched AFTER the
      # build, since `eas build --non-interactive` refuses to proceed with
      # uncommitted changes unless EAS_BUILD_AUTOCOMMIT is set, and committing
      # a credential-shaped edit is exactly what we are avoiding.
      - name: Build
        id: build
        if: ${{ !inputs.dry_run && !inputs.submit_only }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ${{ steps.asckey.outputs.path }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # Not optional, and missing it fails differently in each of the two
          # steps below. At build, resolveCredentials.js:145 resolves the team
          # id from EXPO_APPLE_TEAM_ID and PROMPTS for it when unset -- and a
          # prompt under --non-interactive is a dead build. At submit it fails
          # softer and worse: ensureTestFlightSetup.js:38 sees no team id, logs
          # "App Store Connect credentials are incomplete, skipping TestFlight
          # setup" and RETURNS. The upload still succeeds, so the run is green,
          # and there is no TestFlight group to install the build from.
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -eo pipefail
          cd mobile
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --wait \
            --message "${MESSAGE:-$GITHUB_SHA}"

      # ascAppId cannot come from an environment variable (see the header), so it
      # is written in here and reverted below. Runner-only: this edit is never
      # added, never committed, and the revert is unconditional.
      #
      # The three ascApiKey* fields are here for a different reason. The
      # EXPO_ASC_* environment variables authenticate credential operations, and
      # they are enough for the certificate step and for TestFlight group setup
      # -- but NOT for the upload. `eas submit` resolves its key separately
      # (IosSubmitCommand.js:102-127) and falls back to the key stored in the
      # EAS credentials service, which on a fresh account does not exist:
      #
      #     Looking up credentials configuration for com.termpolis.remote...
      #     App Store Connect API Keys cannot be set up in --non-interactive mode.
      #
      # (SetUpAscApiKey.js:40, run 34146951983 -- after a successful forty-minute
      # build.) Naming the key in the profile takes the `path` source instead and
      # never consults the credentials service, which also keeps the key in
      # GitHub secrets rather than uploading it to Expo. All three fields are
      # required together: any subset is a hard error in non-interactive mode.
      - name: Point the submit profile at the App Store Connect record
        id: patch
        if: ${{ !inputs.dry_run && inputs.submit }}
        env:
          # A variable OR a secret. The App Store Connect app id is public -- it
          # is the digits in the app's own App Store URL -- so a variable is the
          # honest home for it and keeps it readable in the run log. But it looks
          # exactly like the four credentials it is collected alongside, so it
          # gets set as a secret about half the time, and reading only `vars`
          # turns that into a build that finishes and then refuses to upload.
          # Accept either. The digits-only check below is what actually guards
          # the value.
          ASC_APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_PATH: ${{ steps.asckey.outputs.path }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          if [ -z "$ASC_APP_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "patched=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The build is finished and stored on EAS, but it was not uploaded: ASC_APP_ID or APPLE_TEAM_ID is not set."
            exit 0
          fi
          # Checked here rather than trusted, because the failure this prevents
          # costs a whole build to discover.
          if [ ! -s "$ASC_API_KEY_PATH" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "patched=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The build is finished and stored on EAS, but it was not uploaded: the App Store Connect key is incomplete."
            exit 0
          fi
          node -e '
            const fs = require("fs")
            const p = "mobile/eas.json"
            const j = JSON.parse(fs.readFileSync(p, "utf8"))
            const ios = j.submit.production.ios
            ios.ascAppId = process.env.ASC_APP_ID
            ios.appleTeamId = process.env.APPLE_TEAM_ID
            ios.ascApiKeyPath = process.env.ASC_API_KEY_PATH
            ios.ascApiKeyId = process.env.ASC_KEY_ID
            ios.ascApiKeyIssuerId = process.env.ASC_ISSUER_ID
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n")
          '
          # Apple checks this before it checks anything else, and the failure it
          # gives for a non-numeric id names neither the field nor the file.
          node -e '
            const id = require("./mobile/eas.json").submit.production.ios.ascAppId
            if (!/^[0-9]+$/.test(id)) {
              console.error(`ASC_APP_ID must be digits only, got: ${id}`)
              console.error("It is the number in the App Store Connect URL for the app.")
              process.exit(1)
            }
          '
          echo "patched=true" >> "$GITHUB_OUTPUT"

      # --latest picks the build that just finished. Separate from the build step
      # rather than folded into it with --auto-submit, so that a submit failure
      # (a rejected key, a missing app record) leaves a finished build on EAS to
      # retry against instead of throwing away forty minutes of compute. Run the
      # workflow again with submit_only to collect on that: the build step is
      # skipped and --latest still resolves to the same finished build.
      - name: Submit to App Store Connect
        id: submit
        if: ${{ !inputs.dry_run && inputs.submit && steps.patch.outputs.patched == 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ${{ steps.asckey.outputs.path }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # See the build step: without this, TestFlight setup is skipped with
          # a log line and the run still reports success.
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eo pipefail
          cd mobile
          # No --what-to-test. EAS gates the TestFlight changelog behind its
          # Enterprise plan, and passing the flag does not degrade -- it fails
          # the whole submission after the build is already done:
          #
          #     This submission specified the `changelog` parameter. Changelog
          #     submission is currently available for Enterprise plan only.
          #
          # (run 34147655565). The notes are typed into App Store Connect >
          # TestFlight > the build > Test Details instead; the summary step
          # below says so.
          eas submit --platform ios --profile production --latest \
            --non-interactive --wait

      # Unconditional, and deliberately not `git checkout` of a path list that
      # could grow: whatever the run did to the working tree, none of it is
      # allowed to outlive the job.
      - name: Revert the submit profile
        if: always()
        run: git checkout -- mobile/eas.json || true

      - name: Shred the App Store Connect key
        if: always()
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          if [ -f "$key_path" ]; then
            shred -u "$key_path" 2>/dev/null || rm -f "$key_path"
          fi

      # Gated on either step, not just the build: under submit_only the build
      # is skipped, and a skipped outcome is not a successful one, so keying
      # this on the build alone printed nothing on the one run that finally
      # uploaded (34148157308) -- precisely the run whose leftover manual steps
      # someone needs. The heading adapts for the same reason.
      - name: Say what still has to be done by hand
        if: ${{ !inputs.dry_run && (steps.build.outcome == 'success' || steps.submit.outcome == 'success') }}
        run: |
          {
            if [ "${{ steps.build.outcome }}" = 'success' ]; then
              echo '### iOS build finished'
            else
              echo '### iOS build submitted'
            fi
            echo
            if [ "${{ steps.submit.outcome }}" = 'success' ]; then
              echo 'The build is uploaded and processing in App Store Connect.'
              echo 'Processing takes roughly 15 minutes; TestFlight shows it after that.'
              echo
              echo 'Three things this workflow cannot do:'
              echo
              echo '1. **Answer export compliance.** The build lands marked *Missing'
              echo '   Compliance* because `ITSAppUsesNonExemptEncryption` is `true`,'
              echo '   which is correct. Answer **Yes, it uses encryption**, then'
              echo '   **Yes, it qualifies for an exemption** -- standard published'
              echo '   algorithms (X25519, HKDF-SHA256, ChaCha20-Poly1305) in a'
              echo '   mass-market app. Answering "no exemption" routes the build'
              echo '   into export-documentation review and blocks TestFlight for'
              echo '   as long as that takes.'
              echo '2. **Add yourself as an internal tester.** TestFlight ->'
              echo '   Internal Testing -> add your Apple ID, then install the'
              echo '   TestFlight app on the phone.'
              echo '3. **Type the What to Test notes.** TestFlight -> the build'
              echo '   -> Test Details. `eas submit --what-to-test` is not an'
              echo '   option: EAS gates the changelog behind its Enterprise plan'
              echo '   and fails the whole submission rather than skipping it.'
              echo
              echo 'A public App Store listing additionally needs the screenshots'
              echo 'and listing copy described in `mobile/store/screenshots.md` and'
              echo '`mobile/store/listing.md`. TestFlight needs neither.'
            else
              echo 'The build compiled and is stored on EAS, but it was **not**'
              echo 'uploaded to App Store Connect.'
              echo
              echo 'Set the App Store Connect app id and re-run with **submit**'
              echo 'checked; the finished build is reused, not rebuilt:'
              echo
              echo '```'
              echo 'gh variable set ASC_APP_ID --body "<digits from the App Store Connect URL>"   # or gh secret set'
              echo '```'
              echo
              echo 'The app record is created at appstoreconnect.apple.com -> Apps'
              echo "-> + -> New App, with bundle id \`$BUNDLE_ID\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
