name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The release gates on the SAME suite every push gets — lint, typecheck, build,
  # the unit matrix WITH its coverage thresholds, package-verify, and e2e on Linux
  # and macOS. This job used to be a bare `npx vitest run` on two runners, which
  # meant a tag could publish installers that no coverage gate, no typecheck and no
  # e2e had ever seen; "push the commit, wait for Tests to go green, THEN push the
  # tag" was a human standing in for a missing machine gate. Now the tag waits.
  test:
    uses: ./.github/workflows/test.yml

  # The three build jobs run in parallel and each used to upload straight to the tag, which
  # meant each one also tried to CREATE the release if it could not see one yet. GitHub's
  # read-your-writes lag across that API turned it into a race: on v1.36.0 the mac/linux jobs
  # created release 371780057, the Windows job could not find it by tag through three retries,
  # created its own, and got `already_exists` — so a fully built and signed Windows installer
  # was thrown away and the release published with no .exe and, worse, no `latest.yml`, the
  # manifest every Windows client polls to discover an update. Creating the release exactly
  # once, before the fan-out, removes the race instead of retrying harder inside it.
  #
  # It is created as a DRAFT. Until v1.39.0 it was created live, ahead of every artifact,
  # so a single platform failing (`fail-fast: false` guarantees the others still finish)
  # left a permanently public release missing that platform's installer AND its latest*.yml
  # — which is what shipped on v1.39.0 when notarization timed out. A draft is invisible to
  # users and to electron-updater, so a partial build now publishes nothing at all. The
  # release goes live only after validate-draft has checked the bytes (see publish-release).
  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create the release for this tag (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The reuse branch must FORCE the draft state, not assume it.
          # action-gh-release's update path (taken whenever the release already
          # exists) sends `draft: existingRelease.draft` and ignores the `draft:`
          # input entirely -- so nothing downstream can pull a release back once
          # it is public. Re-running a workflow whose release already published
          # would otherwise swap freshly-built assets onto a LIVE release, with
          # every gate below skipped if any build then failed.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — forcing it back to a draft for this run."
            gh release edit "$TAG" --draft=true
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --draft
          fi

  build:
    needs: [test, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "npm install failed (attempt $i), cleaning cache and retrying..."
            npm cache clean --force || true
            sleep 10
          done

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Download bundled CLI tools
        run: bash scripts/download-tools.sh
        continue-on-error: true

      # The bundled embedding model powers offline semantic memory on every OS.
      # download-embedding-model.sh already retries transient HuggingFace 429/5xx
      # with backoff and hard-fails on a too-small file, so a momentary throttle
      # self-heals. We deliberately do NOT continue-on-error here: a genuine
      # failure must fail the build rather than silently ship a model-less
      # installer that degrades memory to keyword-only for that platform's users
      # (the v1.12.2-v1.12.4 "model silently absent" failure class). The packaged
      # output is then asserted by the per-platform "Verify embedding model
      # bundled" steps below.
      - name: Download bundled embedding model
        run: bash scripts/download-embedding-model.sh

      - name: Import Apple certificate
        if: matrix.platform == 'mac'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/apple-cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Copy tree-sitter grammars
        # Populates resources/grammars/ from the tree-sitter-wasms devDep — required by both the
        # renderer build and electron-builder's extraResources (the grammars are gitignored).
        run: node scripts/copy-grammars.cjs

      - name: Build app
        run: npx electron-vite build
        env:
          # Crash reporting + light usage telemetry. Both gated by an in-app
          # opt-in (see src/main/telemetry.ts); even with the DSN baked in,
          # nothing leaves the user's machine until they consent. Empty when
          # the secret isn't set, which makes Sentry init a no-op.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Fix spawn-helper permissions (macOS)
        if: matrix.platform == 'mac'
        run: |
          # node-pty's spawn-helper needs execute permission for posix_spawnp
          find node_modules/node-pty -name "spawn-helper" -type f -exec chmod 755 {} \; -print

      # macOS + Linux: unchanged single-shot package.
      - name: Package (macOS + Linux)
        if: matrix.platform != 'win'
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Windows is built in TWO phases so we can code-sign the INNER app
      # executable (win-unpacked/Termpolis.exe) — the binary Windows Defender
      # actually scans and quarantines. electron-builder only ever signs the
      # OUTER installer, so the unpacked Termpolis.exe shipped UNSIGNED and
      # tripped Defender's cloud-ML C2/RAT classifier (Trojan:Win32/Cinjo.O!cl).
      # Phases:
      #   1. build only the unpacked dir,
      #   2. sign win-unpacked/Termpolis.exe,
      #   3. build the NSIS installer FROM the now-signed dir.
      # The outer installer is still signed by the existing step further down,
      # and latest.yml's sha512 is recomputed after that — so signing the inner
      # exe (which changes the installer bytes) needs no extra metadata fixup.
      - name: Package — unpacked dir only (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --dir --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The `--prepackaged nsis` step below SKIPS the electron-builder pack
      # phase that normally writes resources/app-update.yml. Without this, the
      # Windows installer ships WITHOUT that file and auto-update dies on every
      # client with "ENOENT ... resources\app-update.yml" (Sentry ELECTRON-8 /
      # issue #14, regressed in v1.15.4 when the two-phase inner-exe signing was
      # introduced). Write it into the unpacked dir now — BEFORE the installer
      # is packaged from that dir — deterministically from package.json's
      # build.publish config.
      - name: Write app-update.yml into unpacked dir (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: node scripts/writeAppUpdateYml.cjs dist-electron-builder/win-unpacked/resources

      # Non-fatal by design — same rationale as the installer-signing step:
      # an eSigner hiccup (SSL.com quota/OAuth/TOTP/outage) must NEVER abort
      # the release. If this fails we pack the UNSIGNED inner exe (exactly
      # today's behaviour) rather than stranding the whole Windows build.
      # malware_block:false so SSL.com's own pre-sign scan won't refuse to sign
      # the very AI-agent network→shell pattern Defender flags.
      - name: Sign inner Termpolis.exe (Windows)
        id: sign-inner-win
        if: matrix.platform == 'win'
        continue-on-error: true
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.SSL_COM_USERNAME }}
          password: ${{ secrets.SSL_COM_PASSWORD }}
          credential_id: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSL_COM_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/dist-electron-builder/win-unpacked/Termpolis.exe
          malware_block: false
          override: true

      - name: Note inner-exe signing result (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          if [ "${{ steps.sign-inner-win.outcome }}" = "success" ]; then
            echo "Inner Termpolis.exe signed successfully."
          else
            echo "::warning::Inner Termpolis.exe was NOT signed (eSigner outcome: ${{ steps.sign-inner-win.outcome }}). Packing it unsigned (status quo); the outer installer is still signed below. Defender may keep flagging the unpacked exe until inner-exe signing succeeds on a later release."
          fi

      - name: Package — NSIS installer from signed dir (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis --prepackaged dist-electron-builder/win-unpacked --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Belt-and-suspenders: the afterPack hook (scripts/afterPack.cjs)
      # already verifies this during the build, but we also verify the
      # final packaged output BEFORE we upload anything to GitHub.
      # If the adapter is missing, we fail the job here — no broken
      # installer ever reaches users.
      - name: Verify MCP adapter in packaged output (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: node scripts/verifyPackagedResources.cjs dist-electron-builder/win-unpacked
      # Never ship a Windows installer whose offline memory model is missing —
      # asserts resources/models/** + the onnxruntime-web WASM are bundled.
      - name: Verify embedding model bundled (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: node scripts/verifyPackagedResources.cjs --model dist-electron-builder/win-unpacked
      # Fail-fast guard: the Windows two-phase build silently dropped
      # app-update.yml in v1.15.4/v1.15.5 (issue #14). Never upload a Windows
      # installer whose updater config is missing or malformed.
      - name: Verify app-update.yml in packaged output (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: node scripts/writeAppUpdateYml.cjs --verify dist-electron-builder/win-unpacked/resources
      - name: Verify MCP adapter in packaged output (Linux)
        if: matrix.platform == 'linux'
        run: node scripts/verifyPackagedResources.cjs dist-electron-builder/linux-unpacked
      - name: Verify embedding model bundled (Linux)
        if: matrix.platform == 'linux'
        run: node scripts/verifyPackagedResources.cjs --model dist-electron-builder/linux-unpacked
      - name: Verify MCP adapter in packaged output (macOS x64)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          # electron-builder produces mac/ and mac-arm64/ for universal builds.
          for d in dist-electron-builder/mac dist-electron-builder/mac-arm64; do
            if [ -d "$d" ]; then
              echo "Verifying $d..."
              node scripts/verifyPackagedResources.cjs "$d"
            fi
          done

      # macOS is the least-verified arch for the memory stack (different .app
      # Resources layout + notarization) and this assertion has never run on a
      # Mac build before. Introduce it WARN-FIRST (continue-on-error) so a latent
      # mac-only bundling gap surfaces as a signal without blocking the Mac DMG —
      # memory would just degrade to keyword-only, the status quo. Flip to a hard
      # gate (drop continue-on-error) once it's been observed green on a release.
      - name: Verify embedding model bundled (macOS)
        if: matrix.platform == 'mac'
        continue-on-error: true
        shell: bash
        run: |
          for d in dist-electron-builder/mac dist-electron-builder/mac-arm64; do
            if [ -d "$d" ]; then
              echo "Verifying embedding model in $d..."
              node scripts/verifyPackagedResources.cjs --model "$d"
            fi
          done

      - name: Notarize macOS DMGs
        if: matrix.platform == 'mac'
        timeout-minutes: 30
        run: |
          for DMG in dist-electron-builder/*.dmg; do
            echo "Notarizing: $DMG"

            # Submit and capture the submission ID
            SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --output-format json 2>&1) || true
            echo "$SUBMIT_OUTPUT"
            SUB_ID=$(echo "$SUBMIT_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])" 2>/dev/null || echo "")

            if [ -z "$SUB_ID" ]; then
              echo "Failed to get submission ID, trying with --wait directly"
              xcrun notarytool submit "$DMG" \
                --apple-id "${{ secrets.APPLE_ID }}" \
                --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
                --team-id "${{ secrets.APPLE_TEAM_ID }}" \
                --wait --timeout 20m
            else
              echo "Submission ID: $SUB_ID"
              # Poll with retries to handle transient network drops
              for i in 1 2 3; do
                echo "Waiting for notarization (attempt $i)..."
                xcrun notarytool wait "$SUB_ID" \
                  --apple-id "${{ secrets.APPLE_ID }}" \
                  --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
                  --team-id "${{ secrets.APPLE_TEAM_ID }}" \
                  --timeout 10m && break
                echo "Wait interrupted, retrying in 30s..."
                sleep 30
              done

              # Check final status
              xcrun notarytool info "$SUB_ID" \
                --apple-id "${{ secrets.APPLE_ID }}" \
                --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
                --team-id "${{ secrets.APPLE_TEAM_ID }}"
            fi

            xcrun stapler staple "$DMG"
            echo "Notarization complete for $DMG"
          done

      # `xcrun stapler staple` writes the notarization ticket into each .dmg
      # AFTER electron-builder wrote latest-mac.yml, so the recorded SHA512
      # + size are stale by ~2KB per dmg. Recompute them now or
      # validate-draft fails (and Mac auto-update breaks).
      - name: Refresh latest-mac.yml after notarization (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          for DMG in dist-electron-builder/*.dmg; do
            echo "Refreshing latest-mac.yml entry for $DMG"
            node scripts/refreshLatestYml.cjs --installer "$DMG" --yml dist-electron-builder/latest-mac.yml
          done

      - name: Find Windows installer
        if: matrix.platform == 'win'
        id: find-exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist-electron-builder" -Filter "*.exe" | Select-Object -First 1
          echo "EXE_PATH=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          echo "Found installer: $($exe.FullName)"

      # Non-fatal by design: a signing hiccup (SSL.com eSigner quota exhaustion,
      # OAuth/TOTP blip, service outage) must NEVER abort the whole release —
      # that strands the macOS/Linux artifacts and skips the aggregate jobs.
      # If this step fails we publish the functional UNSIGNED installer below
      # (with a consistent latest.yml) and signing resumes on the next release.
      # Defender pass-through is reputation-based, not EV-dependent, so an
      # occasional unsigned build still installs and runs.
      - name: Sign Windows installer
        id: sign-win
        if: matrix.platform == 'win'
        continue-on-error: true
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.SSL_COM_USERNAME }}
          password: ${{ secrets.SSL_COM_PASSWORD }}
          credential_id: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSL_COM_TOTP_SECRET }}
          file_path: ${{ steps.find-exe.outputs.EXE_PATH }}
          malware_block: false
          override: true

      - name: Note Windows signing result
        if: matrix.platform == 'win'
        shell: bash
        run: |
          if [ "${{ steps.sign-win.outcome }}" = "success" ]; then
            echo "Windows installer signed successfully."
          else
            echo "::warning::Windows installer was NOT signed (eSigner outcome: ${{ steps.sign-win.outcome }}). Publishing the functional unsigned installer so the release is not blocked. This is almost certainly the SSL.com signing quota being exhausted; signing resumes automatically on the next release once the quota resets."
          fi

      # Code-signing modifies the .exe in place, so the SHA512 in latest.yml
      # (written by electron-builder before signing) is now stale. Recompute
      # it against the signed binary or auto-update will fail with
      # "sha512 checksum mismatch" on every install.
      - name: Refresh latest.yml after signing (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: node scripts/refreshLatestYml.cjs --installer "${{ steps.find-exe.outputs.EXE_PATH }}" --yml dist-electron-builder/latest.yml

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2.6.1
        with:
          # REQUIRED. action-gh-release@v2.6.1 calls finalizeRelease() after its
          # uploads, which flips a draft live unless `input_draft === true`. Without
          # this the first platform to finish publishes the release — re-opening the
          # exact hole create-release's --draft was added to close.
          #
          # What it does NOT do: re-draft an already-public release. The update path
          # hardcodes `draft: existingRelease.draft` and never reads this input. That
          # is create-release's job (see the forced `--draft=true` above), and the
          # only reason a rerun is safe.
          draft: true
          # Notes are generated once by create-release. Asking for them here too would have
          # all three jobs PATCH the same release body concurrently for no benefit.
          files: |
            dist-electron-builder/*.exe
            dist-electron-builder/*.dmg
            dist-electron-builder/*.zip
            dist-electron-builder/*.AppImage
            dist-electron-builder/*.deb
            dist-electron-builder/*.blockmap
            dist-electron-builder/latest*.yml

  # ---- The release gate, in two jobs --------------------------------
  #
  # Until v1.39.0 this was ONE job, `validate-update-metadata`, and it was
  # broken in two independent ways.
  #
  # 1. STRUCTURAL. It was `needs: build`, and GitHub SKIPS a job whose needs
  #    failed. So the guard against "a platform failed" could only ever run
  #    in the case where no platform had failed. It had never fired in anger
  #    and by construction never could.
  # 2. LOGICAL. Even when it did run, validateLatestYml.cjs treated an
  #    entirely ABSENT latest*.yml as a skip rather than a failure. The
  #    v1.39.0 release published with no latest-mac.yml at all, and because
  #    the other two fetched fine it would have reported "all valid".
  #
  # The release is now a draft until it has been checked, which makes
  # `needs: build` skipping exactly the right behaviour: nothing reaches
  # users. --strict closes the second hole. And the same validator runs
  # TWICE over one codepath -- once on the draft's bytes, before anyone can
  # see them, and once on the live CDN URLs electron-updater actually hits.

  # Validates the draft's assets on disk, before publication. `gh release
  # download` writes them flat, so the validator swaps its TRANSPORT (--dir)
  # and not its logic. Checks that every advertised file exists, that its
  # sha512 and size match the actual bytes -- the gap that broke v1.11.23/24
  # auto-update -- and that `version` matches the tag.
  validate-draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --omit=optional --no-audit --no-fund
      - name: Download the draft's assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "${GITHUB_REF_NAME}" --dir draft-assets --clobber
      - name: Validate latest*.yml against the draft's bytes
        run: node scripts/validateLatestYml.cjs --version "${GITHUB_REF_NAME}" --dir draft-assets --strict

  # The publish. Nothing in this job but the flip -- every check that could
  # keep a release away from users has already run.
  # The flip to public and the check that the public URLs actually serve are
  # ONE job on purpose. Split across two, a retract left the release
  # unrecoverable by re-running: `gh run rerun --failed` re-runs only failed
  # jobs and their dependents, and the publish job had SUCCEEDED. The re-run
  # therefore verified a release nothing would ever re-publish, failed again on
  # three 404s, and re-retracted. Fused, re-running this one job re-flips the
  # release live and then re-checks it.
  publish-release:
    needs: validate-draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --omit=optional --no-audit --no-fund
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
      # Give GitHub a beat to finalize the publish -- the API returns before
      # CDN edges can serve the newly-public assets consistently.
      - name: Wait for release CDN consistency
        run: sleep 30
      # Same validator, same flags as validate-draft, now against the public URLs
      # electron-updater will hit. validate-draft proved the bytes are right;
      # this proves they are actually being served.
      #
      # Retried, unlike the draft check: a failure here is about SERVING, not
      # content, and CDN propagation is genuinely eventually-consistent. One
      # unlucky poll must not retract a good release -- that is a worse failure
      # than the one it guards.
      - name: Validate latest*.yml against live release
        id: live_check
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BASE="https://github.com/codedev-david/termpolis/releases/download"
          for attempt in 1 2 3; do
            if node scripts/validateLatestYml.cjs --version "$VERSION" --base "$BASE" --strict; then
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          echo "Live validation failed 3 times over ~60s -- this is not propagation lag."
          exit 1
      # Gated on the CHECK failing, not on the job failing. A bare `if: failure()`
      # also fires when checkout or npm install dies, which would un-publish a
      # perfectly good release because a runner had a bad minute.
      - name: Retract to draft if the live release is broken
        if: failure() && steps.live_check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Live validation failed -- pulling $GITHUB_REF_NAME back to a draft."
          gh release edit "${GITHUB_REF_NAME}" --draft=true

  # Chocolatey and the termpolis.com mirror are the two channels that reach end
  # users OUTSIDE GitHub Releases. They used to run inside `build (win)`, which
  # put them ahead of every gate: the Chocolatey package rewrites
  # chocolateyinstall.ps1 to point at releases/download/v$version/..., a URL a
  # draft does not serve, so a build that failed on another platform left a
  # public Chocolatey listing whose installer 404s permanently. Gated on
  # publish-release, both now ship only bytes that were validated twice.
  #
  # The installer comes from the release rather than a build workspace, so the
  # hash Chocolatey advertises is over the exact bytes users download.
  publish-windows-channels:
    needs: publish-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch the published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "${env:GITHUB_REF_NAME}" --pattern "Termpolis.Setup.*.exe" --dir dist-electron-builder --clobber
      - name: Upload installer to termpolis.com
        shell: pwsh
        run: |
          # Copy the .exe plus a stable-name copy for the Microsoft Store
          New-Item -ItemType Directory -Path "ftp-staging" -Force
          $exe = Get-ChildItem -Path "dist-electron-builder" -Filter "*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "ftp-staging/"
          Copy-Item $exe.FullName "ftp-staging/Termpolis-Setup-Latest.exe"

      # Mirror the installer to termpolis.com/downloads. This is a NON-CRITICAL
      # convenience mirror — GitHub Releases (uploaded above) is the source of
      # truth that electron-updater auto-update reads — so a transient transfer
      # failure must never mark the whole release run as failed.
      #
      # Uses curl over EXPLICIT FTPS (FTP + AUTH TLS; --ssl-reqd refuses to fall
      # back to plaintext) with retries, which fixes the SamKirkland action's
      # flaky control-socket timeouts. Credentials are passed via env, not the
      # command line. (SFTP is a cleaner transport still; switching needs the host
      # to expose SSH/SFTP + an SSH key secret — tracked as a follow-up.)
      - name: Mirror installer to termpolis.com/downloads (FTPS, retried)
        continue-on-error: true
        shell: pwsh
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Engineered to ALWAYS exit 0 so this non-critical mirror can never
          # red-flag an otherwise-good release; any failure surfaces only as a
          # ::warning::. GitHub Releases stays the source of truth that
          # electron-updater reads for auto-update.
          #
          # We try full certificate verification FIRST, then fall back to TLS
          # WITHOUT the cert-name check: GoDaddy's FTPS endpoint currently
          # presents a certificate whose principal name doesn't match $FTP_HOST
          # (Windows Schannel error SEC_E_WRONG_PRINCIPAL / curl exit 60).
          # --insecure keeps the channel TLS-encrypted (credentials never cross
          # the wire in plaintext); it only skips the name check. When the host
          # certificate is corrected, the verified path resumes automatically.
          $ErrorActionPreference = 'Continue'
          # Don't let a native non-zero exit (curl) throw before we inspect it:
          # PowerShell 7.3+ would otherwise terminate the step on curl exit 60.
          $PSNativeCommandUseErrorActionPreference = $false
          $base = @(
            '--ssl-reqd', '--fail', '--silent',
            '--retry', '6', '--retry-delay', '5', '--retry-all-errors',
            '--user', "${env:FTP_USERNAME}:${env:FTP_PASSWORD}"
          )
          $failed = 0
          foreach ($f in (Get-ChildItem ftp-staging -File)) {
            $dest = "ftp://${env:FTP_HOST}/downloads/"
            Write-Host "Uploading $($f.Name) via FTPS (verified) ..."
            curl.exe @base -T "$($f.FullName)" "$dest"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Verified FTPS failed (curl exit $LASTEXITCODE); retrying with TLS but no cert-name check ..."
              curl.exe @base --insecure --show-error -T "$($f.FullName)" "$dest"
            }
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::Could not mirror $($f.Name) to termpolis.com/downloads (curl exit $LASTEXITCODE). GitHub Releases still has the build; the website link may be stale until the next successful mirror."
              $failed++
            } else {
              Write-Host "Mirrored $($f.Name) successfully."
            }
          }
          if ($failed -eq 0) { Write-Host "All installer files mirrored to termpolis.com/downloads." }
          exit 0

      - name: Publish to Chocolatey
        continue-on-error: true
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $version = (node -p "require('./package.json').version")
          $exe = Get-ChildItem -Path "dist-electron-builder" -Filter "*.exe" | Select-Object -First 1
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash

          # Update install script with correct URL and hash
          $installScript = Get-Content "packaging/chocolatey/tools/chocolateyinstall.ps1" -Raw
          $installScript = $installScript -replace 'REPLACE_WITH_SHA256', $hash
          $installScript = $installScript -replace 'download/v[\d.]+/', "download/v$version/"
          $installScript = $installScript -replace 'Termpolis\.Setup\.[\d.]+\.exe', "Termpolis.Setup.$version.exe"
          Set-Content "packaging/chocolatey/tools/chocolateyinstall.ps1" $installScript

          # Update nuspec version and release notes URL
          $nuspec = Get-Content "packaging/chocolatey/termpolis.nuspec" -Raw
          $nuspec = $nuspec -replace '<version>.*</version>', "<version>$version</version>"
          $nuspec = $nuspec -replace '<releaseNotes>.*</releaseNotes>', "<releaseNotes>https://github.com/codedev-david/termpolis/releases/tag/v$version</releaseNotes>"
          Set-Content "packaging/chocolatey/termpolis.nuspec" $nuspec

          # Pack and push. Non-critical: GitHub Releases is the source of truth,
          # so a Chocolatey hiccup (moderation queue, push quota, transient 5xx)
          # must never red-flag the release — surface it as a ::warning:: and
          # exit 0 instead. The native-error guard keeps a non-zero choco exit
          # from throwing before we can downgrade it to a warning.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          cd packaging/chocolatey
          choco pack
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::choco pack failed (exit $LASTEXITCODE); skipping Chocolatey publish for this release."
            exit 0
          }
          choco push "termpolis.$version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::choco push failed (exit $LASTEXITCODE). GitHub Releases still has the build; the Chocolatey package will update on the next successful push."
          }
          exit 0


  # Fires a repository_dispatch at codedev-david/homebrew-termpolis so that
  # tap rewrites Casks/termpolis.rb against the new tag's DMG sha256s. Gated
  # on publish-release so we only bump the tap once the release is live AND its
  # update metadata has been checked. Will silently no-op until
  # HOMEBREW_TAP_TOKEN is set.
  bump-homebrew-tap:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap bump"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          gh api repos/codedev-david/homebrew-termpolis/dispatches \
            -f event_type=termpolis-release \
            -f "client_payload[version]=$version"
