name: E2E soak

# The e2e suite (Tests' e2e-full and e2e-windows jobs), several times over in parallel, on any
# OS. Two uses:
#   - a flake one run only hits now and then needs many runs to show itself: the app.close()
#     teardown hang hit about one shard in ten. A quit that overruns leaves its diagnosis in
#     test-results/teardown-hangs/, uploaded with each job's results and warned on the run.
#   - the whole suite on macOS, where Tests runs only a smoke of it, or on any OS for one ref
#     against another: the same specs on main and on a branch, side by side, before an upgrade
#     like Electron 43.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, full SHA or refs/pull/N/head to test
        required: false
        default: main
      os:
        description: Runner (ubuntu-24.04 matches Tests e2e-full; ubuntu-latest is 26.04, where Playwright has no chromium yet)
        required: false
        default: ubuntu-24.04
        type: choice
        options: [ubuntu-24.04, ubuntu-latest, windows-latest, macos-latest]
      copies:
        description: How many times to run each shard, as a JSON list
        required: false
        default: '[1, 2, 3]'
      specs:
        description: Spec files to run (space-separated, e.g. e2e/chrome-smoke.spec.ts). Empty = all.
        required: false
        default: ''
      display:
        description: Linux only. wayland = a headless Weston compositor and no X server at all, so the app can only start as a native Wayland client (Electron 38+'s default in a Wayland session).
        required: false
        default: x11
        type: choice
        options: [x11, wayland]

jobs:
  # The bundled embedding model, downloaded once for every shard and copy, as in Tests' model job: the export specs
  # (world-export.spec.ts) export a smart Ask page with it and fail in CI without it.
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      key: ${{ steps.model.outputs.key }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Download bundled embedding model
        run: bash scripts/download-embedding-model.sh
      - name: Hash the embedding model
        id: model
        shell: bash
        run: echo "key=bge-small-$(cd resources/models && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Cross-OS: a Windows or macOS soak restores it too. A key that already exists is left as it is.
      - name: Cache the embedding model
        uses: actions/cache/save@v4
        with:
          path: resources/models
          key: ${{ steps.model.outputs.key }}
          enableCrossOsArchive: true

  e2e:
    needs: model
    runs-on: ${{ inputs.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        copy: ${{ fromJSON(inputs.copies) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "npm install failed (attempt $i), cleaning cache and retrying..."
            npm cache clean --force || true
            sleep 10
          done
      # Linux only, as in Tests. Electron is the only browser a spec launches; on Linux the step
      # stays for the system libraries --with-deps installs, which Electron's Chromium loads too.
      - name: Install Playwright browsers
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install gdb
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends gdb || true
      # e2e/world-platform.spec.ts types `lumopolis` in bash and in zsh, and fails when zsh is missing, as test.yml's
      # e2e job knows. Same step as there: install zsh and make compinit's folders as a desktop has them.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends zsh
          insecure=$(zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null || true)
          echo "compaudit: ${insecure:-nothing insecure}"
          if [ -n "$insecure" ]; then echo "$insecure" | xargs sudo chmod g-w,o-w; fi
      # The model job's download, by the exact hash of its files.
      - name: Restore the embedding model
        uses: actions/cache/restore@v4
        with:
          path: resources/models
          key: ${{ needs.model.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Build
        run: npm run build
      # node-pty forks through its prebuilt spawn-helper on macOS, which npm can extract without
      # +x; every terminal then fails to start ("posix_spawnp failed") and specs that open one in
      # a project folder never get past the New Terminal dialog. Same step as test.yml/release.yml.
      - name: Fix spawn-helper permissions (macOS)
        if: runner.os == 'macOS'
        run: |
          find node_modules/node-pty -name "spawn-helper" -type f -exec chmod 755 {} \; -print
      - name: Allow the Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if unshare -Ur true; then echo "TERMPOLIS_E2E_SANDBOX=1" >> "$GITHUB_ENV"; fi
      - name: Start a headless Wayland compositor
        if: runner.os == 'Linux' && inputs.display == 'wayland'
        run: |
          sudo apt-get install -y --no-install-recommends weston
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          nohup weston --backend=headless --socket=wayland-e2e --width=1600 --height=1000 --idle-time=0 > /tmp/weston.log 2>&1 &
          for i in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/wayland-e2e" ] && break; sleep 1; done
          [ -S "$XDG_RUNTIME_DIR/wayland-e2e" ] || { cat /tmp/weston.log; exit 1; }
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      # TERMPOLIS_E2E_PREBUILT: the specs launch the Build step's out/ instead of each building it
      # again (ensureE2eBuild, e2e/helpers/launch.ts). The step's timeout sits under the job's: a
      # step out of time fails and the upload below still runs, where a job out of time is
      # cancelled and skips it, losing the traces and teardown-hang reports of that very run.
      - name: Whole e2e suite
        timeout-minutes: 68
        shell: bash
        env:
          TERMPOLIS_E2E_PREBUILT: '1'
        run: |
          run=(npx playwright test ${{ inputs.specs }} --shard=${{ matrix.shard }}/4 --reporter=list)
          if [ "$RUNNER_OS" = Linux ] && [ "${{ inputs.display }}" = wayland ]; then
            # No DISPLAY: if Electron fell back to X11 it could not start at all.
            env -u DISPLAY WAYLAND_DISPLAY=wayland-e2e XDG_SESSION_TYPE=wayland "${run[@]}"
          elif [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum "${run[@]}"
          else
            "${run[@]}"
          fi
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ inputs.os }}-shard${{ matrix.shard }}-copy${{ matrix.copy }}
          # The docs screenshots too, so a styling change can be compared before and after.
          path: |
            test-results/
            e2e/screenshots/docs/
          retention-days: 7
