name: E2E soak

# The Linux e2e suite (Tests' e2e-full job), three times over in parallel. A flake one run only
# hits now and then needs many runs to show itself: the app.close() teardown hang hit about one
# shard in ten. A quit that overruns leaves its diagnosis in test-results/teardown-hangs/, which
# is uploaded with each job's results, and as a warning on the run.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to test
        required: false
        default: main

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        copy: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "npm install failed (attempt $i), cleaning cache and retrying..."
            npm cache clean --force || true
            sleep 10
          done
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Install gdb
        run: sudo apt-get install -y --no-install-recommends gdb || true
      - name: Build
        run: npm run build
      - name: Allow the Chromium sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if unshare -Ur true; then echo "TERMPOLIS_E2E_SANDBOX=1" >> "$GITHUB_ENV"; fi
      - name: Whole e2e suite
        run: xvfb-run --auto-servernum npx playwright test --shard=${{ matrix.shard }}/4 --reporter=list
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: soak-shard${{ matrix.shard }}-copy${{ matrix.copy }}
          path: test-results/
          retention-days: 7
