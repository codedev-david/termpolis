name: Tests
on:
  pull_request:
    branches: [main]
jobs:
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "npm install failed (attempt $i), cleaning cache and retrying..."
            npm cache clean --force || true
            sleep 10
          done
      - name: Build
        run: npm run build
      # bash, as in e2e-soak, where these specs were stabilized on Windows: the shells the specs
      # open inherit this step's environment. TERMPOLIS_E2E_PREBUILT: the specs launch the Build
      # step's out/ instead of each building it again (ensureE2eBuild, e2e/helpers/launch.ts).
      # A step timeout under the job's, as in e2e-full, so a run out of time still uploads.
      - name: Whole e2e suite
        timeout-minutes: 38
        shell: bash
        env:
          TERMPOLIS_E2E_PREBUILT: '1'
        run: npx playwright test e2e/account-chooser.spec.ts -g "Codex at its usage limit" --reporter=list --retries=0
      - name: Upload failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-windows-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
