name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Callable so release.yml gates on the REAL suite. Before this, a tag ran
  # `npx vitest run` and nothing else — no lint, no typecheck, no coverage
  # threshold, no e2e — so the only thing standing between a red commit and
  # published installers was remembering to watch Tests before tagging.
  workflow_call:

jobs:
  # Fast static checks — run on every push/PR.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "npm install failed (attempt $i), cleaning cache and retrying..."
            npm cache clean --force || true
            sleep 10
          done
      - name: Lint
        run: npm run lint
      # The build is esbuild: it STRIPS types without checking them. So `Cannot find name
      # 'memoryHostPid'` built clean, got signed, and shipped in v1.26.1 — the handler threw a
      # ReferenceError on every call and the panel it fed reported "unknown" forever. Nothing in this
      # repo ran tsc. Now something does, and it runs BEFORE the build that can't see this.
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Tailwind 4 runs behind a parity layer that makes it emit what Tailwind 3 did (see the top
      # of src/renderer/src/index.css). Undo any part of it and the app looks different while every
      # test still passes; tailwindParity.test.ts can only read the source, so a Tailwind or Vite
      # upgrade that compiles the same source differently gets past it. This reads what was built.
      - name: Verify the renderer CSS keeps Tailwind 3 parity
        run: node scripts/verifyRendererCss.cjs out/renderer

  # The relay is a separate npm project with its own lockfile, and its tests run
  # inside real workerd rather than a mock -- Durable Object storage, alarms and
  # WebSocket semantics behave as they will in production. That makes a green
  # suite meaningful evidence, so this job is blocking like the rest.
  #
  # Blocking matters more here than elsewhere: the relay is the one component
  # that ships by `wrangler deploy` rather than in the installer, so a break
  # reaches every paired phone at once and cannot be rolled back by asking users
  # not to upgrade.
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - name: Install relay dependencies
        run: npm ci --prefix relay
      - name: Typecheck relay
        run: npm --prefix relay run typecheck
      - name: Test relay
        run: npm --prefix relay test -- --coverage

  # The phone client. Pure TypeScript unit tests -- no simulator, no device, no
  # Expo account. `src/wire/` is a second implementation of the same wire format
  # the desktop speaks, and tests/electron/remoteMobileInterop.test.ts (in the
  # `unit` job) is what keeps the two honest; this job only proves the phone
  # tree builds and passes on its own.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci --prefix mobile
      - name: Typecheck mobile
        run: npm --prefix mobile run typecheck
      # src/wire/ has its own standalone tsconfig because the desktop's unit job
      # transforms those files without mobile/node_modules. Compile it on its own
      # here so that config cannot rot into something only Expo can load.
      - name: Typecheck the wire format standalone
        run: npm --prefix mobile run typecheck:wire
      # src/net/ has one too, for remoteBlankTerminal.test.ts, which runs the
      # phone's RemoteSession in that same job.
      - name: Typecheck the network layer standalone
        run: npm --prefix mobile run typecheck:net
      - name: Test mobile
        run: npm --prefix mobile run test:coverage

  # Unit tests across all three target platforms so we catch
  # platform-specific regressions (path separators, shell detection, node-pty).
  unit:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "npm install failed (attempt $i), cleaning cache and retrying..."
            npm cache clean --force || true
            sleep 10
          done
      # Populate resources/grammars so the code-graph tree-sitter loader resolves grammars from the
      # SAME candidate dir CI-and-local (deterministic branch coverage — otherwise CI falls back to
      # node_modules and lands a fraction lower on the razor-thin branch gate).
      - name: Copy tree-sitter grammars
        run: node scripts/copy-grammars.cjs
      # Coverage gates run on Windows only. src/main has ~19
      # `process.platform === 'win32'` checks whose win32 side never
      # executes on Linux/macOS, so each platform lands at a slightly
      # different coverage number. Gating on one platform keeps the
      # 90/85 thresholds meaningful instead of flapping on ~1% drift.
      # Ubuntu/macOS still run every test — they catch platform-specific
      # regressions (path separators, shell detection, node-pty), just
      # without the coverage denominator.
      - name: Unit tests (with coverage gates)
        if: matrix.os == 'windows-latest'
        run: npx vitest run --coverage --retry=2 --reporter=verbose --reporter=json --outputFile.json=test-output.json
      - name: Unit tests
        if: matrix.os != 'windows-latest'
        run: npx vitest run --retry=2 --reporter=verbose --reporter=json --outputFile.json=test-output.json
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-output-${{ matrix.os }}
          path: |
            test-output.json
            coverage/
          retention-days: 7

  # Packaging regression guard — builds a REAL unpacked app (no installer,
  # no signing, ~1 min) and asserts the MCP stdio adapter was shipped.
  #
  # Why this exists: v1.11.5 shipped a broken installer where Claude Code's
  # ~/.mcp.json pointed at an adapter file that did not physically exist.
  # No unit test could catch it because the unit tests pin package.json
  # config but not electron-builder's actual output. This job runs
  # electron-builder --dir on Linux (cheapest), then runs our verifier
  # against the produced dist-electron-builder/linux-unpacked tree. If
  # the adapter is not shipped, this fails the PR.
  package-verify:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "npm install failed (attempt $i), cleaning cache and retrying..."
            npm cache clean --force || true
            sleep 10
          done
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Download bundled embedding model
        run: bash scripts/download-embedding-model.sh
      # Un-gates semantic recall in CI: with the real model now on disk
      # (resources/models), the skipIf(!hasBundledModel) tests RUN here and prove
      # real-embedding cross-agent recall — the plain unit jobs lack the model.
      - name: Real-embedding semantic recall (model present)
        run: npx vitest run tests/electron/localEmbedder.test.ts tests/electron/bertTokenizer.test.ts tests/electron/memorySemanticRecall.test.ts --reporter=verbose
      # Retrieval-quality GATE: with the real bge model present, the recall benchmark asserts
      # nDCG@10/recall@10/MRR absolute floors AND non-regression vs the committed baseline
      # (tests/electron/fixtures/recall-baseline.json). A change that degrades recall fails CI.
      - name: Recall benchmark GATE (real bge — floors + non-regression baseline)
        run: npm run bench:recall
      # PROOF GATE: the numbers published on the website (lookup latency, token leverage, learning
      # from feedback, typed bug->fix relationship) are asserted here against the real model, so the
      # marketing claims can never drift ahead of measured reality.
      - name: Proof benchmark GATE (real bge — fast lookups / token leverage / learning / relationships)
        run: npm run bench:proof
      - name: Build app
        run: npx electron-vite build
      # The built main entries are ESM and electron-vite leaves real dependencies as
      # runtime imports, so a CommonJS dep whose named exports Node cannot lex throws
      # only when the built child STARTS. A utilityProcess that dies on its first line
      # is silent -- v1.39.2 shipped a Remote bridge that never minted a pairing code
      # and only an e2e shard noticed. This reads the build itself, before packaging.
      - name: Verify child entry imports resolve at runtime
        run: npm run verify:child-imports
      - name: Package (unpacked, no installer, no signing)
        run: npx electron-builder --dir --publish never
      - name: Verify MCP adapter shipped in packaged resources
        run: node scripts/verifyPackagedResources.cjs dist-electron-builder/linux-unpacked
      - name: Verify embedding model + onnxruntime-web WASM bundled
        run: node scripts/verifyPackagedResources.cjs --model dist-electron-builder/linux-unpacked
      # `apt remove termpolis` runs the .deb's prerm (build/linux/before-remove.sh), which takes
      # Termpolis back out of each user's Claude Code, Codex and Gemini CLI configs, as the
      # Windows uninstaller does. Only a release builds a .deb, so this packs one from the
      # unpacked app and checks what fpm made of it: the prerm is that script, the bundle it runs
      # (resources/disconnect-agents.cjs) is in the package, and the packaged app does the work.
      # Run as root, the way dpkg runs it, against a throwaway home: an upgrade (the in-app
      # updater's too) must leave the agent connected, and a remove must take it out and leave
      # the files it rewrote owned by the user.
      - name: Verify the .deb prerm disconnects agents on remove, and only then
        shell: bash
        run: |
          set -eu
          npx electron-builder --linux deb --prepackaged dist-electron-builder/linux-unpacked --publish never
          deb=$(ls dist-electron-builder/*.deb)
          t=$RUNNER_TEMP/deb-prerm
          me=$(id -un)
          mkdir -p "$t/control" "$t/root/etc" "$t/home/.config/termpolis"
          dpkg-deb -e "$deb" "$t/control"
          if [ ! -x "$t/control/prerm" ] || ! cmp build/linux/before-remove.sh "$t/control/prerm"; then
            echo "::error::The .deb's prerm is not build/linux/before-remove.sh"; exit 1
          fi
          dpkg-deb -x "$deb" "$t/root"
          if [ ! -f "$t/root/opt/Termpolis/resources/disconnect-agents.cjs" ]; then
            echo "::error::The .deb does not ship resources/disconnect-agents.cjs"; exit 1
          fi
          # The fake root's /etc/passwd lists only this runner's account, with the throwaway home,
          # whose ~/.claude.json holds the MCP entry Termpolis writes.
          printf '%s:x:%s:%s::%s:/bin/sh\n' "$me" "$(id -u)" "$(id -g)" "$t/home" >"$t/root/etc/passwd"
          echo '{"mcpServers":{"termpolis":{"command":"node","args":["/opt/Termpolis/resources/mcp-adapter/stdio-adapter.cjs"]}}}' >"$t/home/.claude.json"
          connected() {
            node -e 'const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); process.exit(c.mcpServers?.termpolis ? 0 : 1)' "$t/home/.claude.json"
          }
          sudo env TERMPOLIS_PRERM_ROOT="$t/root" "$t/control/prerm" upgrade 99.0.0
          if ! connected; then echo "::error::The prerm disconnected the agents on an upgrade"; exit 1; fi
          sudo env TERMPOLIS_PRERM_ROOT="$t/root" "$t/control/prerm" remove
          if connected; then echo "::error::The prerm left the agents connected on remove"; exit 1; fi
          for f in "$t/home/.claude.json" "$t/home/.config/termpolis/agent-integration.json"; do
            owner=$(stat -c %U "$f")
            if [ "$owner" != "$me" ]; then echo "::error::$f is owned by $owner, not $me"; exit 1; fi
          done
      - name: Upload unpacked output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-electron-builder-linux
          path: dist-electron-builder/linux-unpacked/
          retention-days: 3

  # The Windows installer, updating over a running Termpolis the way the in-app updater does.
  # build/installer.nsh replaces electron-builder's "is the app running" check, which ran
  # PowerShell's Get-CimInstance Win32_Process on every update: on a monitored work computer that
  # process query, started under Termpolis.exe, reads as discovery to endpoint security. This
  # builds an unsigned installer (a runner's Defender is off, so nothing quarantines it), installs
  # it, starts the app and a Node-mode helper from its exe, updates with /S --updated, and fails
  # unless the update closed both, finished, and started no PowerShell, tasklist or wmic
  # (scripts/test-installer-update.ps1). release.yml runs this workflow, so it gates every release.
  installer-update:
    needs: static
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "npm install failed (attempt $i), cleaning cache and retrying..."
            npm cache clean --force || true
            sleep 10
          done
      - name: Download bundled embedding model
        shell: bash
        run: bash scripts/download-embedding-model.sh
      - name: Build app
        run: npm run build
      - name: Package an unsigned installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never
      - name: Install, then update over the running app
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist-electron-builder -Filter 'Termpolis*Setup*.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'no installer was built' }
          ./scripts/test-installer-update.ps1 -Installer $installer -UserDataDir (Join-Path $env:RUNNER_TEMP 'termpolis-profile') -Out (Join-Path $env:RUNNER_TEMP 'installer-update.json')
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-update
          path: ${{ runner.temp }}/installer-update.json
          retention-days: 7
          if-no-files-found: ignore

  # THE Linux e2e gate: the WHOLE e2e directory, blocking, sharded 4 ways.
  #
  # Until v1.32.5 CI ran 18 named specs and 34 of the 52 on disk had never been
  # executed at all. A spec that cannot fail rots silently: v1.30.3 removed a
  # feature and the specs asserting it went stale with nothing to say so, and
  # swarm-integration spent releases red on a mock file that had been deleted.
  # Anything that genuinely cannot run on a hosted runner lives in e2e/manual/
  # (see its README) and is excluded by playwright.config.ts's testIgnore — so
  # "not in the gate" is now a decision written down somewhere, not an accident.
  e2e-full:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "npm install failed (attempt $i), cleaning cache and retrying..."
            npm cache clean --force || true
            sleep 10
          done
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # quitApp() (e2e/helpers/launch.ts) attaches gdb to a main process that won't quit, so the
      # warning it leaves names the native frame the quit is stuck in.
      - name: Install gdb
        run: sudo apt-get install -y --no-install-recommends gdb || true
      - name: Build
        run: npm run build
      # e2e/linux-sandbox.spec.ts launches with Chromium's sandbox ON (issue #32), which needs
      # unprivileged user namespaces. Ubuntu 24.04 restricts them by default; lift that here.
      - name: Allow the Chromium sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if unshare -Ur true; then
            echo "TERMPOLIS_E2E_SANDBOX=1" >> "$GITHUB_ENV"
          else
            echo "::warning::no unprivileged user namespaces on this runner; linux-sandbox.spec.ts will skip"
          fi
      # Sharded: Electron forces workers=1 inside a job, and once the 34 specs
      # actually launched, the whole directory ran past the 90-minute cap and was
      # cancelled mid-suite. Separate runners are the only parallelism available.
      # TERMPOLIS_E2E_PREBUILT: the specs launch the Build step's out/ instead of each
      # building it again (ensureE2eBuild, e2e/helpers/launch.ts).
      # The step's own timeout sits under the job's on purpose. A step that runs out of time
      # FAILS and the job goes on to the upload below; a job that runs out is CANCELLED, which
      # skips the `!cancelled()` upload and loses the traces of exactly the run that needs them.
      - name: Whole e2e suite
        timeout-minutes: 52
        env:
          TERMPOLIS_E2E_PREBUILT: '1'
        run: xvfb-run --auto-servernum npx playwright test --shard=${{ matrix.shard }}/4 --reporter=list
      - name: Upload failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-full-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # THE Windows e2e gate: the whole e2e directory again, blocking, sharded 4 ways like e2e-full.
  #
  # ConPTY, NTFS ACLs and the hosted runner's 1024x768 desktop exist only here. Until this job,
  # Windows e2e ran only when someone dispatched e2e-soak, and three Windows-only failures built
  # up unseen, two of them product bugs: the prompt parse lost the prompt ConPTY sends after
  # every Enter, and mcp-token's ACL lockdown could leave the file with an empty ACL.
  #
  # No Playwright browser install: Electron is the only browser a spec launches (e2e-full keeps
  # the step on Linux, where --with-deps also installs system libraries). The gdb, xvfb and
  # sandbox steps are Linux-only. If a runner-image bump destabilizes this job, flip
  # continue-on-error to true while stabilizing, as with e2e-smoke-macos, rather than papering
  # over a real regression.
  e2e-windows:
    needs: static
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "npm install failed (attempt $i), cleaning cache and retrying..."
            npm cache clean --force || true
            sleep 10
          done
      - name: Build
        run: npm run build
      # bash, as in e2e-soak, where these specs were stabilized on Windows: the shells the specs
      # open inherit this step's environment. TERMPOLIS_E2E_PREBUILT: the specs launch the Build
      # step's out/ instead of each building it again (ensureE2eBuild, e2e/helpers/launch.ts).
      # A step timeout under the job's, as in e2e-full, so a run out of time still uploads.
      - name: Whole e2e suite
        timeout-minutes: 38
        shell: bash
        env:
          TERMPOLIS_E2E_PREBUILT: '1'
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=list
      - name: Upload failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-windows-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # macOS e2e smoke: Darwin runner exercising the core boot + first-run
  # flows. e2e-full above is Linux-only, so this is the sole Darwin coverage —
  # a handful of specs intentionally, not the whole suite, because what it is
  # here to catch is platform drift (node-pty rebuilds, shell detection,
  # Electron-on-arm64), not app logic:
  #   - chrome-smoke: clicks every sidebar button, catches hooks/render
  #     regressions and node-pty rebuild drift.
  #   - first-run-zero-agents: proves a brand-new macOS user — no Claude,
  #     no Codex, no Gemini — can still boot the app and open a
  #     terminal. This is the path a first-time TestFlight reviewer hits.
  #   - linked-machines: Settings ▸ Linked machines through the forked
  #     bridge child (code minted, own code refused, switched off), so a
  #     Mac can be the computer a delegated job runs on.
  #
  # Required on main as of v1.11.15 — first green seen on 0342333.
  # If macOS starts flaking after a runner-image bump or similar, flip
  # continue-on-error back to true while we stabilize rather than
  # papering over a real regression.
  e2e-smoke-macos:
    needs: static
    runs-on: macos-latest
    continue-on-error: false
    # The Build step runs before any spec, so the specs launch its out/ instead of each
    # building it again (ensureE2eBuild, e2e/helpers/launch.ts).
    env:
      TERMPOLIS_E2E_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "npm install failed (attempt $i), cleaning cache and retrying..."
            npm cache clean --force || true
            sleep 10
          done
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      # node-pty spawns a PTY on macOS through a helper binary (spawn-helper) that
      # must carry the executable bit; npm's tarball extraction on the macos runner
      # can land it without +x, which surfaces only at run time as "posix_spawnp
      # failed" when a Command step opens its terminal. node-pty 1.x ships PREBUILT
      # binaries — the helper lives at prebuilds/<platform>-<arch>/spawn-helper (NOT
      # build/Release, which doesn't exist for the prebuild), so `find` it wherever
      # it lands and re-assert +x. Mirrors release.yml's proven step exactly so the
      # e2e runner matches the shipped mac build; -print leaves evidence in the log.
      - name: Fix spawn-helper permissions (macOS)
        run: |
          find node_modules/node-pty -name "spawn-helper" -type f -exec chmod 755 {} \; -print
      - name: Smoke-click every sidebar button (macOS)
        run: npx playwright test e2e/chrome-smoke.spec.ts
      - name: First-run with zero AI agents installed (macOS)
        run: npx playwright test e2e/first-run-zero-agents.spec.ts
      - name: Report-a-Problem flow (macOS)
        run: npx playwright test e2e/report-problem.spec.ts
      - name: Workflow Orchestrator author→run→green (macOS)
        run: npx playwright test e2e/workflow-orchestrator.spec.ts
      - name: Linked machines settings (macOS)
        run: npx playwright test e2e/linked-machines.spec.ts
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-macos
          path: test-results/
          retention-days: 7
